<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>浪浪山：妖怪合伙人</title>
<style>
:root{
  --ink:#14100b; --ink2:#1e1710; --ink3:#2a2015;
  --gold:#d9a441; --goldhi:#f4d98b; --golddim:#8a6a2a;
  --paper:#f2e7cd; --dim:#b3a180;
  --red:#a33428; --red2:#7e231d;
  --cN:#e05545; --cM:#3aa89e; --cZ:#d9a441; --cB:#8a7fa8;
  --ok:#7bc47f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0b0805;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--paper);display:flex;justify-content:center}
.serif{font-family:"Songti SC","STSongti-SC","SimSun",serif}
#app{position:relative;width:min(480px,100vw);height:100dvh;max-height:960px;background:
 radial-gradient(120% 60% at 50% -8%,rgba(217,164,65,.10),transparent 55%),
 radial-gradient(90% 50% at 90% 105%,rgba(126,35,29,.30),transparent 60%),
 linear-gradient(180deg,#1a1410,#141008 60%,#110d07);
 overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8)}
@media(min-width:520px){#app{border-radius:24px;margin:12px auto;height:calc(100dvh - 24px);max-height:900px;border:1px solid #3a2f1e}}

.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
img{display:block}
.dimtx{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;font-size:14px;letter-spacing:.06em;padding:11px 18px;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(180deg,#f0cc74,#c9922f 55%,#a8741f);color:#3d2408;font-weight:700;box-shadow:0 3px 10px rgba(217,164,65,.35)}
.btn-red{background:linear-gradient(180deg,#a33428,#7e231d 60%);color:#ffe4c9;border:1px solid rgba(244,217,139,.35)}
.btn-ghost{background:rgba(0,0,0,.3);color:var(--dim);border:1px solid rgba(200,181,141,.3)}
.btn[disabled]{filter:grayscale(.9) brightness(.55);cursor:not-allowed}
.panel{background:linear-gradient(180deg,rgba(42,32,24,.92),rgba(26,20,13,.95));border:1px solid rgba(217,164,65,.26);border-radius:14px;padding:12px}
.ptitle{font-size:12px;color:var(--goldhi);letter-spacing:.16em;display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ptitle::before{content:"";width:3px;height:12px;background:linear-gradient(180deg,var(--goldhi),var(--red));border-radius:2px}

/* ===== 标题页 ===== */
#scr-title{align-items:center;justify-content:center;gap:14px;padding:24px}
#scr-title .art{position:absolute;top:20px;right:-95px;width:240px;opacity:.13;transform:rotate(10deg);pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 95%);mask-image:linear-gradient(180deg,#000 55%,transparent 95%)}
#scr-title .logo{font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-weight:900;font-size:clamp(35px,10vw,48px);letter-spacing:.14em;color:var(--goldhi);text-shadow:1px 2px 0 #61371a,2px 4px 0 #2a170d,0 7px 24px rgba(217,164,65,.4);text-align:center;line-height:1.3}
#scr-title .sub{font-size:13px;letter-spacing:.3em;color:var(--dim);text-align:center}
#scr-title .menu{display:flex;flex-direction:column;gap:11px;width:min(280px,84%);margin-top:18px}
#scr-title .menu .btn{padding:13px 0;font-size:15px}
#scr-title .tip{position:absolute;bottom:18px;font-size:11px;color:#6d5f45}

/* ===== 主城通用 ===== */
.hub-top{flex:none;display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
.hub-title{font-size:17px;letter-spacing:.1em;color:var(--goldhi)}
.wallet{margin-left:auto;display:flex;gap:6px}
.coin{font-size:11.5px;color:var(--gold);background:rgba(0,0,0,.35);border:1px solid rgba(217,164,65,.3);border-radius:9px;padding:3px 9px;font-variant-numeric:tabular-nums}
.hub-body{flex:1;overflow-y:auto;padding:4px 14px 16px;scrollbar-width:none}
.hub-body::-webkit-scrollbar{display:none}
.hub-nav{flex:none;display:flex;background:rgba(10,7,4,.95);border-top:1px solid rgba(217,164,65,.25)}
.hub-nav button{flex:1;padding:11px 0 13px;font-size:11px;color:#7d6f57;display:flex;flex-direction:column;align-items:center;gap:3px}
.hub-nav button.on{color:var(--goldhi)}
.hub-nav button span{font-size:17px;line-height:1}

/* 关卡 */
.chap-label{font-size:12px;color:var(--goldhi);letter-spacing:.14em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.chap-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(217,164,65,.3),transparent)}
.stage{display:flex;align-items:center;gap:11px;border:1px solid rgba(217,164,65,.22);background:linear-gradient(160deg,rgba(44,33,22,.9),rgba(24,18,12,.95));border-radius:13px;padding:10px 12px;margin-bottom:9px;transition:transform .1s}
.stage:active{transform:scale(.98)}
.stage.lock{opacity:.45}
.stage .emblem{width:52px;height:52px;flex:none;border-radius:50%;overflow:hidden;border:1.5px solid var(--golddim)}
.stage.cur .emblem{border-color:var(--goldhi);box-shadow:0 0 12px rgba(244,217,139,.3)}
.stage .emblem img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.stage .info{flex:1;min-width:0}
.stage .nm{font-size:14.5px;color:var(--paper)}
.stage .ds{font-size:11px;color:var(--dim);margin-top:2px}
.stage .st{margin-top:3px;display:flex;gap:6px}
.tag{font-size:9.5px;border-radius:6px;padding:1px 7px;border:1px solid rgba(200,181,141,.3);color:var(--dim)}
.tag.boss{border-color:rgba(224,85,69,.55);color:#ff9d8a}
.tag.wild{border-color:rgba(58,168,158,.5);color:#6fd3c8}
.tag.done{border-color:rgba(123,196,127,.45);color:var(--ok)}
.stage .go{flex:none;font-size:11.5px;padding:7px 14px}

/* 队伍 */
.slot{display:flex;align-items:center;gap:10px;border:1px dashed rgba(200,181,141,.35);border-radius:12px;padding:9px 11px;margin-bottom:8px;background:rgba(0,0,0,.22)}
.slot.filled{border-style:solid;border-color:rgba(217,164,65,.3)}
.slot .pic{width:46px;height:66px;border-radius:8px;overflow:hidden;flex:none;background:#241b12}
.slot .pic img{width:100%;height:100%;object-fit:cover}
.slot .inf{flex:1;min-width:0}
.slot .nm{font-size:13.5px;display:flex;align-items:center;gap:6px}
.slot .lv{font-size:10px;color:var(--gold)}
.slot .bars{margin-top:5px}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .35s}
.bar.hp i{background:linear-gradient(90deg,#7bc47f,#4e9e57)}
.bar.hp.mid i{background:linear-gradient(90deg,#e8c36a,#c9922f)}
.bar.hp.low i{background:linear-gradient(90deg,#e05545,#a33428)}
.bar.xp i{background:linear-gradient(90deg,#5aa7d6,#3d7fae)}
.slot .ops{display:flex;flex-direction:column;gap:5px}
.slot .ops button{font-size:10.5px;color:var(--dim);border:1px solid rgba(200,181,141,.3);border-radius:8px;padding:4px 9px}
.empty-slot{display:flex;align-items:center;justify-content:center;font-size:12px;color:#6d5f45;border:1px dashed rgba(200,181,141,.3);border-radius:12px;padding:14px;margin-bottom:8px}

/* 名册 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:2/3;border:1.5px solid rgba(200,181,141,.25);background:#241b12;transition:transform .1s}
.tile:active{transform:scale(.94)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .rr{position:absolute;top:2px;left:2px;font-size:8.5px;font-weight:700;padding:0 5px;border-radius:5px;color:#241b12}
.tile.owned{border-color:var(--gold)}
.tile .lvchip{position:absolute;bottom:2px;right:2px;font-size:8.5px;background:rgba(0,0,0,.6);color:var(--goldhi);border-radius:4px;padding:0 4px}
.rare-U{background:#ff8a2a}.rare-S{background:#e8c36a}.rare-R3{background:#a86ee0;color:#f2e7cd!important}.rare-R{background:#5aa7d6;color:#0d2233!important}

/* 商店 */
.shop-item{display:flex;align-items:center;gap:11px;border:1px solid rgba(217,164,65,.22);border-radius:13px;padding:11px;margin-bottom:9px;background:linear-gradient(160deg,rgba(44,33,22,.9),rgba(24,18,12,.95))}
.shop-item .ic{width:44px;height:44px;flex:none;border-radius:11px;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.3);display:flex;align-items:center;justify-content:center;font-size:21px}
.shop-item .inf{flex:1}
.shop-item .nm{font-size:13.5px}
.shop-item .ds{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.5}

/* ===== 战斗 ===== */
#scr-battle{background:
 radial-gradient(100% 55% at 50% 0%,rgba(217,164,65,.09),transparent 60%),
 linear-gradient(180deg,#231a11,#191009 55%,#0e0906)}
.bt-arena{flex:1;position:relative;min-height:0}
.bt-hud{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:5}
.bt-hud .vn{font-size:10px;color:#ffd98f;border:1px solid rgba(255,217,143,.4);border-radius:7px;padding:2px 8px;background:rgba(0,0,0,.3);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-hud .tn{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.bt-hud .flee{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(200,181,141,.3);color:var(--dim);font-size:13px}

.mon{position:absolute;display:flex;gap:8px;align-items:flex-start;z-index:2}
.mon.enemy{top:52px;left:12px;flex-direction:row}
.mon.player{bottom:16px;right:12px;flex-direction:row-reverse}
.m-sprite{width:128px;border-radius:12px;overflow:hidden;border:1.5px solid rgba(217,164,65,.4);box-shadow:0 10px 24px rgba(0,0,0,.5);flex:none}
.mon.player .m-sprite{width:148px}
.m-sprite img{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:50% 14%}
.m-sprite.fainted img{filter:grayscale(1) brightness(.45)}
.mon.enemy .m-sprite{transform:rotate(2deg)}
.mon.player .m-sprite{transform:rotate(-2deg)}
.m-card{background:rgba(12,9,6,.82);border:1px solid rgba(217,164,65,.3);border-radius:11px;padding:8px 10px;min-width:128px;max-width:158px}
.m-card .r1{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--paper)}
.m-card .lv{font-size:10px;color:var(--gold)}
.flowchip{font-size:9px;border-radius:5px;padding:1px 5px;color:#fff}
.m-card .hpn{font-size:10px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
.mon.enemy .hpn{display:none}
.xpbar{margin-top:5px}
.dmg-float{position:absolute;font-size:21px;font-weight:800;color:#ffd98b;text-shadow:0 2px 6px #000;animation:floatup .9s forwards;pointer-events:none;z-index:9}
.dmg-float.heal{color:#8fe08a}
@keyframes floatup{25%{opacity:1}100%{opacity:0;transform:translateY(-42px)}}
.hitshake{animation:shake .35s}
@keyframes shake{30%{transform:translateX(-6px)}60%{transform:translateX(5px)}}

.bt-menu{flex:none;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px}
.bt-log{background:rgba(0,0,0,.4);border-radius:11px;padding:8px 12px;font-size:11.5px;line-height:1.75;color:var(--paper);height:74px;overflow-y:auto;scrollbar-width:none}
.bt-log::-webkit-scrollbar{display:none}
.bt-log .eff-super{color:#ffb46b}
.bt-log .eff-weak{color:#8fa3b8}
.bt-log .sys{color:var(--goldhi)}
.menu4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu4 button{border-radius:12px;padding:13px 0;font-size:14.5px;letter-spacing:.12em}
.bt-fight{background:linear-gradient(180deg,#a33428,#7e231d);color:#ffe4c9;border:1px solid rgba(244,217,139,.35)}
.bt-mons{background:linear-gradient(180deg,rgba(58,42,28,.95),rgba(30,22,16,.95));border:1px solid rgba(217,164,65,.4);color:var(--paper)}
.bt-bag{background:linear-gradient(180deg,rgba(58,42,28,.95),rgba(30,22,16,.95));border:1px solid rgba(217,164,65,.4);color:var(--paper)}
.bt-run{background:rgba(0,0,0,.3);color:var(--dim);border:1px solid rgba(200,181,141,.3)}
.sublist{display:flex;flex-direction:column;gap:7px}
.sublist .row{display:flex;align-items:center;gap:9px;border:1px solid rgba(217,164,65,.3);background:rgba(0,0,0,.3);border-radius:11px;padding:8px 10px}
.sublist .row[disabled]{filter:grayscale(.9) brightness(.5)}
.sublist .pic{width:36px;height:52px;border-radius:7px;overflow:hidden;flex:none}
.sublist .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.sublist .inf{flex:1;min-width:0;font-size:12px}
.sublist .meta{font-size:10px;color:var(--dim);margin-top:2px}
.backrow{display:flex}
.backrow button{font-size:11.5px;color:var(--dim);border:1px solid rgba(200,181,141,.3);border-radius:9px;padding:6px 14px}

.combo-row{position:absolute;top:46px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:6;pointer-events:none}
.combo-chip{font-size:9px;color:#ffd98f;background:rgba(0,0,0,.55);border:1px solid rgba(255,217,143,.4);border-radius:7px;padding:1px 8px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
@media(max-height:780px){.combo-row{top:40px}.combo-chip{font-size:8.5px}}

/* ===== v2.5 抽卡 ===== */
.gacha-panel{background:linear-gradient(180deg,rgba(42,32,24,.92),rgba(26,20,13,.95));border:1px solid rgba(217,164,65,.26);border-radius:14px;padding:14px}
.g-rates{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.g-rates span{font-size:10px;font-weight:700;border-radius:7px;padding:3px 9px;color:#241b12}
.g-pity{font-size:10.5px;color:var(--dim);margin-bottom:10px;text-align:center}
.g-pity b{color:var(--goldhi)}
.g-last{font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.8;text-align:center}
.g-drawbtn{width:100%;font-size:15px;padding:13px 0}
#ovl-gacha{align-items:center;justify-content:center;background:rgba(8,5,3,.93);cursor:pointer}
.gacha-stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative}
.g-count{position:absolute;top:64px;font-size:12px;color:var(--dim);letter-spacing:.2em}
.g-card{position:relative;width:min(232px,72vw);border-radius:14px;overflow:hidden;animation:gpop .45s;box-shadow:0 16px 44px rgba(0,0,0,.7)}
.g-card img{width:100%;display:block}
.g-card .g-rare{position:absolute;top:8px;left:8px;font-size:12px;font-weight:800;color:#241b12;border-radius:7px;padding:2px 9px}
.g-card.rare-U{box-shadow:0 0 36px rgba(255,138,42,.7),0 16px 44px rgba(0,0,0,.7)}
.g-card.rare-S{box-shadow:0 0 32px rgba(232,195,106,.65),0 16px 44px rgba(0,0,0,.7)}
.g-card.rare-R3{box-shadow:0 0 26px rgba(168,110,224,.55),0 16px 44px rgba(0,0,0,.7)}
.g-card.rare-R{box-shadow:0 0 20px rgba(90,167,214,.45),0 16px 44px rgba(0,0,0,.7)}
.g-name{font-size:20px;color:#fff3d6}
.g-meta{font-size:11px;color:var(--dim)}
.g-hint{font-size:10.5px;color:#8a7a5e;margin-top:4px}
.g-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,220,140,.25),transparent 55%);animation:gflash .6s}
@keyframes gflash{from{opacity:0}}
@keyframes gpop{from{transform:scale(.5) rotateY(90deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.g-card,.g-flash{animation:none}}

/* ===== v2.6 在线对战 ===== */
.vs-room{background:linear-gradient(180deg,rgba(42,32,24,.94),rgba(22,17,11,.96));border:1px solid rgba(217,164,65,.3);border-radius:16px;padding:14px;margin-bottom:10px}
.vs-code{font-size:34px;font-weight:900;letter-spacing:.34em;color:var(--goldhi);text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(244,217,139,.4);margin:2px 0 2px}
.vs-codenote{text-align:center;font-size:10px;color:var(--dim);margin-bottom:10px}
.vs-side{border:1px solid rgba(217,164,65,.25);border-radius:13px;padding:9px;margin-bottom:8px}
.vs-side .st1{font-size:11px;letter-spacing:.14em;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.vs-side.s0 .st1{color:#8fc7ff}.vs-side.s1 .st1{color:#ff9d8a}
.vs-slot{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px dashed rgba(200,181,141,.3);border-radius:10px;padding:7px 9px;margin-bottom:6px;min-height:44px}
.vs-slot.filled{border-style:solid;border-color:rgba(217,164,65,.35)}
.vs-slot .who{flex:1;min-width:0}
.vs-slot .who b{font-size:13px;color:var(--paper)}
.vs-slot .who small{display:block;font-size:9.5px;color:var(--dim);margin-top:1px}
.vs-ready{font-size:9.5px;border-radius:6px;padding:1px 7px;border:1px solid rgba(200,181,141,.3);color:var(--dim)}
.vs-ready.on{color:#9fd8a2;border-color:rgba(123,196,127,.55)}
.vs-act{flex:none;font-size:10px;padding:4px 10px;border-radius:8px}
.vs-cards{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.vs-card{width:60px;text-align:center}
.vs-card img{width:100%;border-radius:7px;border:1.5px solid rgba(200,181,141,.35);aspect-ratio:2/3;object-fit:cover;object-position:50% 12%}
.vs-card small{display:block;font-size:10px;line-height:1.35;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-pickedbar{position:sticky;top:0;z-index:3;margin:0 0 8px;padding:7px 9px;border:1px solid #8a7147;border-radius:9px;background:#241b11f5;color:#ead9b7;font-size:11px;line-height:1.5}.vs-pickedbar b{color:#ffe09a}.vs-card:focus-visible{outline:3px solid #ffe09a;outline-offset:2px}.vs-card.pick{border-color:var(--gold)}.vs-card.picked img{border-color:var(--gold);box-shadow:0 0 8px rgba(244,217,139,.5)}
.v3-actor .dcard{animation:v3Attack .55s ease-out}.v3-hit .dcard{animation:v3Hit .55s ease-out}@keyframes v3Attack{40%{transform:translateY(-14px) scale(1.08);filter:brightness(1.5)}}@keyframes v3Hit{35%{transform:translateX(8px) rotate(4deg);filter:brightness(2)}65%{transform:translateX(-6px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.v3-actor .dcard,.v3-hit .dcard{animation:none}}
.vs-input{display:flex;gap:8px;margin:10px 0}
.vs-input input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(217,164,65,.4);border-radius:11px;color:var(--goldhi);font-size:22px;letter-spacing:.3em;text-align:center;padding:10px 0;font-variant-numeric:tabular-nums;outline:none}
.netnote{font-size:10px;color:var(--dim);line-height:1.8}
.rm-wait{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.1em;padding:16px}
.vs-me{color:#9fd8a2}

.mon.enemy.ally{left:auto;right:12px}
.mon.player.ally{right:auto;left:12px}
.mon.ally .m-sprite{width:96px}
.mon.player.ally .m-sprite{width:110px}
.mon.ally .m-card{min-width:112px;max-width:126px}
.pick-status{display:flex;gap:4px;flex-wrap:wrap;padding:0 2px}
.ps-chip{font-size:9px;color:var(--dim);border:1px solid rgba(200,181,141,.3);border-radius:6px;padding:1px 6px;white-space:nowrap}
.ps-chip.on{color:#9fd8a2;border-color:rgba(123,196,127,.55)}
@media(max-height:780px){.mon.ally .m-sprite{width:78px}.mon.player.ally .m-sprite{width:88px}.mon.ally .m-card{min-width:100px;max-width:112px}}

.duel-row{position:absolute;left:10px;right:10px;display:flex;gap:8px}
.duel-foes{top:52px}
.duel-mine{bottom:12px}
.dslot{flex:1;min-width:0;display:flex;gap:7px;background:rgba(12,9,6,.82);border:1px solid rgba(217,164,65,.35);border-radius:11px;padding:7px}

function load(){try{const g=LanglangSave.load(localStorage,CARDS);if(!g||!g.roster)return null;
  g.items=g.items||{};for(const k of ['gourd','pie','puddin','cleanse','ppFruit','expFruit'])g.items[k]=Number.isInteger(g.items[k])?Math.max(0,g.items[k]):0;
  if(g.skillsVersion!==24){g.roster.forEach(healMon);g.skillsVersion=24;}
  g.roster.forEach(m=>{
    const max=statsOf(byNum(m.num),m.lvl).hp,moves=movesOf(byNum(m.num));
    if(!Array.isArray(m.selectedSkills))m.selectedSkills=[0,1,2,3];
    const pool=LanglangRules.skillPool(byNum(m.num)),oldSkillPP=Array.isArray(m.skillPP)?m.skillPP:[];
    m.skillPP=pool.map((skill,i)=>Number.isFinite(oldSkillPP[i])?Math.max(0,Math.min(skill.pp,oldSkillPP[i])):skill.pp);
    m.hp=Math.max(0,Math.min(Number.isFinite(m.hp)?m.hp:max,max));
    const pp=Array.isArray(m.pp)?m.pp:[];
    m.pp=moves.map((mv,i)=>Number.isFinite(pp[i])?Math.max(0,Math.min(mv.pp,pp[i])):mv.pp);
  });

/* ---------- 抽卡（聚宝阁） ---------- */
const GACHA={cost:300,rareName:{R:"R",R2:"SR",S:"SSR",U:"UR"}};
function rollRarity(force){
  if(force==="SSR+")return Math.random()<.12?"U":"S";
  if(force==="SR+"){const r=Math.random();return r<.18?"U":r<.55?"S":"R2";}
  const x=Math.random();
  if(x<.02)return "U";
  if(x<.12)return "S";
  if(x<.42)return "R2";
  return "R";
}
function drawCard(force,excluded=[]){
  // 新手抽取时排除已抽到的角色；普通抽卡暂沿用原保底逻辑。
  const rar=rollRarity(force||((G.pity||0)>=9?"SSR+":null));
  let pool=CARDS.filter(c=>c.rar===rar&&!excluded.includes(c.num));
  if(!pool.length)pool=CARDS.filter(c=>!excluded.includes(c.num)&&(!force||force!=="SR+"||c.rar!=="R"));
  const c=pool[Math.floor(Math.random()*pool.length)];
  if(rar==="S"||rar==="U")G.pity=0;else G.pity++;
  return c.num;
}
function gachaReveal(nums,done){
  const st=$("#gacha-stage");ovl("ovl-gacha",true);
  let i=0;
  const show=()=>{
    const c=byNum(nums[i]);
    st.innerHTML=`<div class="g-count">${i+1} / ${nums.length}</div>
      <div class="g-flash"></div>
      <div class="g-card ${RAR[c.rar].cls}"><img src="cards/${c.num}.jpg" alt="${c.name}"><span class="g-rare ${RAR[c.rar].cls}">${GACHA.rareName[c.rar]}</span></div>
      <div class="g-name serif">${c.name}</div>
      <div class="g-meta">${RAR[c.rar].n} · ${c.role} · ${LanglangRules.TYPES[LanglangRules.typeOf(c)]}</div>
      <div class="g-hint">${i+1<nums.length?"点击任意处继续揭示":"点击任意处收下"}</div>`;
    st.onclick=()=>{i++;if(i<nums.length)show();else{ovl("ovl-gacha",false);st.onclick=null;done&&done();}};
  };
  show();
}
function avgTeamLvl(){
  if(!G.team.length)return 6;
  const ls=G.team.map(id=>monOf(id)).filter(Boolean).map(m=>m.lvl);
  return Math.max(6,Math.min(20,Math.round(ls.reduce((a,b)=>a+b,0)/ls.length)||6));
}

        <div class="sub">No.${c.num} · ${lvl!=null?"Lv."+lvl:"图鉴资料（未收编）"}</div>
        <div class="tags">${typeChip(c)}<span class="tag">${RAR[c.rar].n}</span><span class="tag">${c.role}</span></div>
        <div class="statgrid">
          <div class="stat"><div class="k">体力 HP</div><div class="v">${st.hp}</div></div>
          <div class="stat"><div class="k">攻击</div><div class="v">${st.atk}</div></div>
          <div class="stat"><div class="k">防御</div><div class="v">${st.def}</div></div>
          <div class="stat"><div class="k">速度</div><div class="v">${st.spd}</div></div>
        </div>
      </div>
    </div>
    ${m?`<div class="panel" style="margin:10px 0"><div>经验 ${m.exp}/${expNeed(m.lvl)} · 经验果 ${G.items.expFruit||0} 个</div><button class="btn btn-gold" id="bt-use-fruit" style="margin-top:8px" ${!G.items.expFruit||m.lvl>=60?"disabled":""}>使用经验果 · 经验 +60</button></div>`:""}
    ${m?`<div class="panel" style="margin:10px 0"><div>体力 ${m.hp}/${st.hp}</div><button class="btn btn-ghost" data-detail-use="pie" ${!G.items.pie||m.hp<=0||m.hp>=st.hp?'disabled':''}>疗伤烧饼 ×${G.items.pie||0}</button> <button class="btn btn-ghost" data-detail-use="puddin" ${!G.items.puddin||m.hp>0?'disabled':''}>还魂丹 ×${G.items.puddin||0}</button><div class="dimtx" style="font-size:11px">回灵果 ×${G.items.ppFruit||0} · 选择技能恢复 5 点 PP</div>${selected.map(idx=>`<button class="btn btn-ghost" data-detail-pp="${idx}" ${!G.items.ppFruit||(m.skillPP?.[idx]??pool[idx].pp)>=pool[idx].pp?'disabled':''}>${escapeHTML(pool[idx].name)} ${m.skillPP?.[idx]??pool[idx].pp}/${pool[idx].pp}</button>`).join(' ')}</div>`:''}

      ${m?selected.map((idx,slot)=>`<label class="move-row">技能 ${slot+1} <select data-solo-skill="${slot}">${pool.map((mv,i)=>`<option value="${i}" ${idx===i?'selected':''} ${mv.learnLevel>m.lvl?'disabled':''}>${escapeHTML(mv.name)} · PP ${mv.pp}${mv.learnLevel>m.lvl?` · Lv${mv.learnLevel}解锁`:''}</option>`).join('')}</select></label>`).join(''):''}

  }));
}

/* --- 即时伤害预览（确定性区间：无会心，随机浮动取 0.85~1.0） --- */
function damageProfile(att,def,mv){
  const ac=byNum(att.mon.num),dc=byNum(def.mon.num);
  const a=monStats(att.mon),d=monStats(def.mon);
  const attack=Math.max(1,Math.round(a.atk*stageMul(att.atkS)*(att.atkMul||1)));
  const defense=Math.max(1,Math.round(d.def*stageMul(def.defS)*(def.defMul||1)));
  const base=Math.floor(Math.floor(42*mv.pow*attack/defense/50)+2);
  const emul=mv.type?effOf(mv.type,dc.idn):1;
  const value=base*((mv.type&&mv.type===ac.idn)?STAB:1)*emul*(att.awakened?1.15:1);
  return {value,emul};
}
function previewDamage(att,def,mv){
  if(!mv.pow)return {lo:0,hi:0,emul:1};
  const r=damageProfile(att,def,mv);
  return {lo:Math.max(1,Math.floor(r.value*.85)),hi:Math.max(1,Math.floor(r.value)),emul:r.emul};
}

/* --- 克制盘（SVG） --- */
function wheelSVG(full,hlA,hlD){
  const F4=["shen","mo","yao","gui"],ang={shen:-90,mo:0,yao:90,gui:180};
  const pt=(a,r)=>[Math.cos(a*Math.PI/180)*r,Math.sin(a*Math.PI/180)*r];
  if(!full){
    const S=40,c=20,r=14,sw=4.6,gap=18;
    let arcs="",defs="",nodes="";
    for(let i=0;i<4;i++){
      const src=F4[i],dst=F4[(i+1)%4];
      const a1=ang[src]+gap,a2=ang[dst]-gap;
      const [x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);
      const C=IDENT[src].c;
      defs+=`<marker id="mwa${i}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" fill="${C}"/></marker>`;
      arcs+=`<path d="M${(c+x1).toFixed(1)},${(c+y1).toFixed(1)} A${r},${r} 0 0 1 ${(c+x2).toFixed(1)},${(c+y2).toFixed(1)}" stroke="${C}" stroke-width="${sw}" fill="none" stroke-linecap="round" marker-end="url(#mwa${i})"/>`;
    }
    F4.forEach(f=>{const [x,y]=pt(ang[f],r);nodes+=`<circle cx="${(c+x).toFixed(1)}" cy="${(c+y).toFixed(1)}" r="4.4" fill="${IDENT[f].c}" stroke="#14100b" stroke-width="1"/>`;});
    return `<svg viewBox="0 0 ${S} ${S}"><defs>${defs}</defs>${arcs}${nodes}</svg>`;
  }
  const S=252,c=126,r=86,sw=5,gap=16;
  let arcs="",defs="",labels="",nodes="";
  for(let i=0;i<4;i++){
    const src=F4[i],dst=F4[(i+1)%4];
    const a1=ang[src]+gap,a2=ang[dst]-gap;
    const [x1,y1]=pt(a1,r),[x2,y2]=pt(a2,r);
    const C=IDENT[src].c;
    defs+=`<marker id="wa${i}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto"><path d="M0,0L10,5L0,10z" fill="${C}"/></marker>`;
    arcs+=`<path d="M${(c+x1).toFixed(1)},${(c+y1).toFixed(1)} A${r},${r} 0 0 1 ${(c+x2).toFixed(1)},${(c+y2).toFixed(1)}" stroke="${C}" stroke-width="${sw}" fill="none" stroke-linecap="round" marker-end="url(#wa${i})" opacity=".9"/>`;
    const mid=(a1+a2)/2,[mx,my]=pt(mid,r+16);
    labels+=`<text x="${(c+mx).toFixed(1)}" y="${(c+my+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd98b">+30%</text>`;
  }
  F4.forEach(f=>{
    const [x,y]=pt(ang[f],r),cx=(c+x).toFixed(1),cy=(c+y).toFixed(1);
    const ring=f===hlA?`<circle cx="${cx}" cy="${cy}" r="31" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>`:f===hlD?`<circle cx="${cx}" cy="${cy}" r="31" fill="none" stroke="#ffd98b" stroke-width="2"/>`:"";
    nodes+=`<circle cx="${cx}" cy="${cy}" r="26" fill="${IDENT[f].c}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><text x="${cx}" y="${+cy+4.5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${IDENT[f].name}</text>${ring}`;
  });
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><defs>${defs}</defs>${arcs}${labels}<circle cx="${c}" cy="${c}" r="15" fill="#5c5346"/><text x="${c}" y="${c+4}" text-anchor="middle" font-size="9" font-weight="700" fill="#f2e7cd">身份克制</text>${nodes}</svg>`;
}

/* --- 拖拽预演：按住技能拖到对手身上，松手施放 --- */
let drag=null,suppressClick=false;
function bindMoveDrag(row,idx,mv){
  row.addEventListener("pointerdown",e=>{
    if(!B||B.busy||B.over||B.forced)return;
    if(moveLock(P(),mv,idx))return;
    drag={idx,mv,sx:e.clientX,sy:e.clientY,id:e.pointerId,started:false,ghost:null};
    try{row.setPointerCapture(e.pointerId);}catch(_){}
  });
  row.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.started){
      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<12)return;
      drag.started=true;row.classList.add("dragging");startGhost(e);
      const c=$("#coach");if(c)c.style.opacity=".12";
    }
    moveGhost(e);dragHover(e);
  });
  const up=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const wasDrag=drag.started,idx2=drag.idx,over=wasDrag?pointInEnemy(e):false;
    endDrag();
    if(wasDrag){suppressClick=true;setTimeout(()=>suppressClick=false,400);}
    if(over){if(TUT.on&&TUT.step===2)TUT.step=3;playerMove(idx2);}
  };
  row.addEventListener("pointerup",up);
  row.addEventListener("pointercancel",()=>{endDrag();suppressClick=true;setTimeout(()=>suppressClick=false,400);});
}
function startGhost(e){
  const g=document.createElement("div");g.className="drag-ghost";
  g.style.background=drag.mv.type?FLOW[drag.mv.type].c:"#7d6f57";
  g.textContent="» "+drag.mv.name;
  $("#app").appendChild(g);drag.ghost=g;moveGhost(e);
}
function moveGhost(e){
  if(!drag||!drag.ghost)return;
  const ar=$("#app").getBoundingClientRect();
  drag.ghost.style.left=(e.clientX-ar.left)+"px";
  drag.ghost.style.top=(e.clientY-ar.top)+"px";
}
function pointInEnemy(e){
  const spr=$(drag&&drag.mv.target==="self"?"#m-player .m-sprite":"#m-enemy .m-sprite");if(!spr)return false;
  const r=spr.getBoundingClientRect(),p=16;
  return e.clientX>=r.left-p&&e.clientX<=r.right+p&&e.clientY>=r.top-p&&e.clientY<=r.bottom+p;
}
function dragHover(e){
  const spr=$(drag.mv.target==="self"?"#m-player .m-sprite":"#m-enemy .m-sprite");if(!spr)return;
  const hit=pointInEnemy(e);
  spr.classList.remove("dv-super","dv-weak","dv-mid");

  if(hit){
    const em=drag.mv.pow&&drag.mv.type?effOf(drag.mv.type,byNum(E().mon.num).idn):1;
    spr.classList.add(em>1?"dv-super":"dv-mid");
    showPreview(drag.mv);
  }else hidePreview();
}
function endDrag(){
  if(drag&&drag.ghost)drag.ghost.remove();
  $$(".m-sprite").forEach(spr=>spr.classList.remove("drag-over","dv-super","dv-weak","dv-mid"));
  $$("#bt-menu .skill-card.dragging").forEach(r=>r.classList.remove("dragging"));

  const c=$("#coach");if(c)c.style.opacity="";

}
function showPreview(mv){
  hidePreview();
  const host=$("#bt-arena"),card=$(mv.target==="self"?"#m-player .m-card":"#m-enemy .m-card");
  if(!host||!card||!B||B.over)return;
  const e=E(),r=previewDamage(P(),e,mv);
  const em=mv.type?effOf(mv.type,byNum(e.mon.num).idn):1;
  const relTxt=!mv.type?"无属性 · 稳定":em>1?"克制 +30%！":(mv.type===byNum(P().mon.num).idn?"同源 +20%":"效果普通");
  const relC=em>1?"#ffd98b":"#f2e7cd";
  const d=document.createElement("div");d.id="dmg-prev";
  d.innerHTML=mv.pow?`<div class="dp-rel" style="color:${relC}">${mv.name} · ${relTxt}</div><div class="dp-n">≈ ${r.lo} ~ ${r.hi}</div>${r.lo>=e.mon.hp?'<div class="dp-kill">命中可击倒</div>':r.hi>=e.mon.hp?'<div class="dp-kill">有机会击倒</div>':""}<div class="meta">命中 ${mv.acc}% · 不含会心</div>`:`<div class="dp-rel">${mv.name}</div><div class="meta">${mv.desc}</div>`;
  host.appendChild(d);
  const ar=host.getBoundingClientRect(),cr=card.getBoundingClientRect();
  d.style.left=Math.max(6,Math.min(cr.left-ar.left,ar.width-132))+"px";
  d.style.top=(cr.bottom-ar.top+8)+"px";
  if(d.offsetTop+d.offsetHeight>host.clientHeight-4)d.style.top=Math.max(58,cr.top-ar.top-d.offsetHeight-8)+"px";
}
function hidePreview(){const d=$("#dmg-prev");if(d)d.remove();}

/* --- 边玩边学引导（聚光高亮 + 分步教学战） --- */
const COACH={on:false,sel:"",text:""};
const TUT={on:false,step:0};
function coach(sel,text){COACH.on=true;COACH.sel=sel;COACH.text=text;renderCoach();}
function coachHide(){COACH.on=false;const c=$("#coach");if(c){c.classList.remove("on");c.innerHTML="";}}
function renderCoach(){
  const c=$("#coach");
  if(!COACH.on){c.classList.remove("on");c.innerHTML="";return;}
  const t=COACH.sel?document.querySelector(COACH.sel):null;
  if(!t){c.classList.remove("on");return;}
  const ar=$("#app").getBoundingClientRect(),r=t.getBoundingClientRect();
  const pad=6,x=r.left-ar.left-pad,y=r.top-ar.top-pad,w=r.width+pad*2,h=r.height+pad*2;
  c.innerHTML=`<div class="coach-ring" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>
    <div class="coach-tip" id="coach-tip">${COACH.text}<br><button type="button" class="coach-skip" id="coach-skip">跳过引导，返回巡山 ✕</button></div>`;
  c.classList.add("on");
  const tip=$("#coach-tip");
  const tx=Math.max(8,Math.min(x,ar.width-260));
  let ty=y+h+10;
  if(ty+tip.offsetHeight+12>ar.height)ty=Math.max(56,y-tip.offsetHeight-10);
  tip.style.left=tx+"px";tip.style.top=ty+"px";
  $("#coach-skip").addEventListener("click",endTutorial);
}
function bestMoveIdx(){
  const p=P(),e=E(),pc=byNum(p.mon.num),ec=byNum(e.mon.num);
  const mvs=movesOf(pc);let bi=0,bs=-1;
  mvs.forEach((mv,i)=>{
    if(moveLock(p,mv,i))return;
    let s;
    if(mv.pow>0)s=mv.pow*mv.acc/100*(mv.type?effOf(mv.type,ec.idn):1)*((mv.type&&mv.type===pc.idn)?1.2:1);
    else if(mv.kind==="heal")s=p.mon.hp<statsOf(pc,p.mon.lvl).hp*0.5?50:2;
    else s=6;
    if(s>bs){bs=s;bi=i;}
  });
  return bi;
}
function tutTick(){
  if(!TUT.on||!B||B.over)return;
  if(TUT.step===1&&B.mode==="menu")coach("#bt-fight","点【战 斗】，选一个技能出手");
  else if(TUT.step===2&&B.mode==="fight"){
    if(B.selectedMove!=null)coach("#bt-confirm-move","确认技能和目标后，点<b>确认出招</b>；也可以换选其他技能");
    else coach(`#bt-menu [data-mv="${bestMoveIdx()}"]`,"金框 = 克制！先<b>选择一个可用技能</b>，确认后出招");
  }
  else if(TUT.step===3)coach("#mini-wheel","右上角小盘是<b>克制盘</b>，试试<b>长按</b>放大看清克制关系");
  else if(TUT.step>=5){
    const e=E();
    if(B.mode==="bag"){
      const g=$('#bt-menu [data-item="gourd"]');
      if(g&&!g.disabled)coach('#bt-menu [data-item="gourd"]',"血越少越好收服！<b>扔紫金红葫芦</b>！");
      else coach("#bt-back","先返回，继续把对手打到残血");
    }
    else if(e.mon.hp<=e.maxHp*0.45)coach("#bt-bag","对手残血了！打开【背 包】，用葫芦收服TA！");
    else if(B.mode==="menu")coach("#bt-fight","继续用克制技能把对手打到<b>残血</b>（血条变红），再收服");
    else coachHide();
  }
  else coachHide();
}
function tutStart(){

  TUT.on=true;TUT.step=1;
  startBattle("tut");
}

let B=null;
function stageMul(s){return s>=0?(2+s)/2:2/(2-s);}
function makeFoe(entry){const m=mkMon(entry[0],entry[1]);return m;}
function wrap(mon){return {mon,atkS:0,defS:0,maxHp:monStats(mon).hp,energy:20,awakened:false,status:{},stunImmune:0,atkMul:1,defMul:1,spdMul:1,gainMul:1,dotBonus:0,enBonus:0};}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function moveLock(w,mv,i){
  if(!Number.isFinite(w.mon.pp[i])||w.mon.pp[i]<=0)return "次数耗尽";
  if(mv.tier&&!w.awakened)return "战意爆发后解锁";
  if(w.energy<mv.cost)return `妖力不足 ${w.energy}/${mv.cost}`;
  return "";
}
function gainEnergy(w,n){w.energy=Math.min(100,w.energy+Math.round(n*(w.gainMul||1)));}
function statusHTML(w){
  let h=w.awakened?'<span class="status-chip awakened">✷ 已爆发</span>':"";
  if(w.atkS)h+=`<span class="status-chip ${w.atkS>0?"good":"bad"}">攻 ${w.atkS>0?"+":""}${w.atkS}</span>`;
  if(w.defS)h+=`<span class="status-chip good">防 +${w.defS}</span>`;
  for(const [key,left] of Object.entries(w.status))h+=`<span class="status-chip ${key}">${({poison:"☠ 中毒",bleed:"◆ 流血",stun:"✹ 眩晕"})[key]} ${left}</span>`;
  if(w.stunImmune)h+='<span class="status-chip good">抗晕</span>';
  return h;
}
function fighterHTML(w,side){
  const c=byNum(w.mon.num),hp=Math.max(0,w.mon.hp),max=w.maxHp;
  return `<div class="mon ${side}" id="m-${side}">
    <div class="m-sprite ${hp<=0?"fainted":""} ${w.awakened?"awakened":""}"><img src="cards/${w.mon.num}.jpg" alt="${c.name}"></div>

}

function startPatrol(type){
  const encounter=LanglangRules.chooseEncounter(CARDS,type,G.cleared.length);
  if(!encounter){toast("这个地界暂时没有可遇见的妖怪");return;}
  startBattle({id:"patrol",ch:0,name:LanglangRules.TYPES[type]+"巡山",wild:true,patrol:true,foes:[[encounter.num,encounter.level]],reward:100,drop:null});
}
function startBattle(stageId){
  const isTut=stageId==="tut";
  let st;
  if(isTut){
    const p0=aliveTeam()[0];
    if(!p0){toast("队伍里没有能战斗的妖怪");return;}
    // 教学对手：选一只被玩家流派克制的防御型妖怪，等级贴着玩家，保证打得动也打得死
    const pc0=byNum(p0.num);
    const dummy={mountain:"030",water:"003",fire:"071",cave:"071"}[LanglangRules.typeOf(pc0)];
    st={id:-1,ch:0,name:"入门试炼",ds:"",wild:true,foes:[[dummy,Math.max(5,Math.min(30,p0.lvl+2))]],reward:100,drop:null,tutorial:true};
  }else st=typeof stageId==="object"?stageId:STAGES[stageId];
  const team=aliveTeam();
  if(!team.length){toast("队伍里没有能战斗的妖怪");return;}
  if(typeof v3StartSolo==='function'){v3StartSolo(st,stageId,team);return;}
  B={
    combos:[],stage:st,stageId,
    wild:st.wild,tutorial:isTut,
    pTeam:team.map(wrap),
    eTeam:st.foes.map(makeFoe).map(wrap),
    aP:0,aE:0,turn:1,
    msg:[],busy:false,forced:false,mode:"menu",over:false,muted:false
  };
  B.combos=[];
  [[B.pTeam,"🤝 你方"],[B.eTeam,"⚔ 敌方"]].forEach(([list,tag])=>{
    const cb=comboOf(list.map(w=>byNum(w.mon.num).fac));
    if(cb){
      B.combos.push({tag,name:cb.name,desc:cb.desc});
      list.forEach(w=>{
        if(cb.dmg)w.dmgMul=cb.dmg;
        if(cb.atk)w.atkMul=cb.atk;
        if(cb.def)w.defMul=cb.def;
        if(cb.spd)w.spdMul=cb.spd;
        if(cb.gain)w.gainMul=cb.gain;
        if(cb.dot)w.dotBonus=cb.dot;
        if(cb.en)w.enBonus=cb.en;
        if(cb.hp){const d=Math.ceil(w.maxHp*(cb.hp-1));w.maxHp+=d;w.mon.hp+=d;}
      });
    }
  });
  // 默认首只非倒地
  while(B.pTeam[B.aP].mon.hp<=0)B.aP++;
  scr("battle");
  logLine("sys",isTut?`「入门试炼」！野生的${byNum(st.foes[0][0]).name}出现了！跟着金光提示操作——`
    :`「${st.name}」！${st.wild?"野生妖怪出现了！":"头目"+byNum(st.foes[0][0]).name+"挡住了去路！"}`);
  B.combos.forEach(cb=>logLine("sys",`${cb.tag}触发「${cb.name}」：${cb.desc}`));
  renderBattle();
}

      }

  }
}

function switchListHTML(activeIdx){
  return B.pTeam.map((w,i)=>{

      lines.push(kindObj.duplicate?`已收服过 ${byNum(kindObj.mon.num).name}，获得经验果 ×1；可在妖怪档案中使用。`:`${byNum(kindObj.mon.num).name}（Lv.${kindObj.mon.lvl}）加入了名册，记得去「队伍」编入出战！`);

  }else{
    title="逃跑成功";cls="lose";
    lines.push("溜了溜了，山核桃都忘了拿。");
  }
  // 教学和战败后免费恢复，其余情况保留体力与技能 PP。
  if(B.tutorial||kindObj.kind==='lose')G.roster.forEach(healMon);

function myName(){return "御妖师"+((G&&G.roster[0])?("·"+byNum(G.roster[0].num).name.slice(0,3)):"");}
/* ---------- 云服务初始化 ---------- */
function netInit(cb){
  if(cloudCli())return cb(true);
  let n=0;
  const t=setInterval(()=>{
    if(cloudCli()){clearInterval(t);cb(true);return;}
    if(++n>60){clearInterval(t);toast("在线服务未就绪：请检查网络后刷新重试");cb(false);}
  },100);
}
function relayFail(e){
  const msg=(e&&(e.message||e.error_description))||"网络异常";
  if(NET._erred&&Date.now()-NET._erred<8000)return;
  NET._erred=Date.now();
  toast("在线服务异常："+msg);
}
/* ---------- 消息收发 ---------- */
function relaySend(target,msg){
  const d=dbx();if(!d||!NET.code||!NET.pid)return;
  return d.from("lls_pkt").insert({room:NET.code,sender:NET.pid,target:target,payload:msg}).then(r=>{
    if(r&&r.error)relayFail(r.error);
  }).catch(relayFail);
}
function hostConn(pid){
  let c=NET.conns.find(x=>x.pid===pid);
  if(c){c.open=true;c._seen=Date.now();return c;}
  c={pid:pid,open:true,_seen:Date.now(),
    send:m=>relaySend(pid,m),
    close:()=>{
      if(!c.open)return;
      c.open=false;
      NET.conns=NET.conns.filter(x=>x!==c);
      onGuestLeave(c);
    }};
  NET.conns.push(c);
  return c;
}
function relayHandleHostPkt(pid,d){
  if(!pid||!d||typeof d!=="object")return;
  const c=hostConn(pid);
  if(B&&B.v3&&B.arena&&B.arena.battle.clock.disconnected[pid]!==undefined&&typeof v3Reconnect==='function')v3Reconnect(pid);
  if(d.t==="ping")return;
  if(d.t==="bye"){c.close();return;}
  if(LOBBY)onGuestMsg(c,d);
}
function relayHandleGuestPkt(row){
  if(!row||!row.payload)return;
  if(row.sender===NET.pid)return;
  const tg=row.target;
  if(tg!=="all"&&tg!==NET.pid)return;
  onHostMsg(row.payload);
}
/* ---------- 轮询循环：房间内新消息，0.4 秒一次 ---------- */
function relayLoop(){
  if(NET._loop)return;
  NET._loop=setInterval(()=>{
    const d=dbx();
    if(!d||!NET.code||NET._busy)return;
    NET._busy=true;
    d.from("lls_pkt").select("id,sender,target,payload")
      .eq("room",NET.code).gt("id",NET._lastId||0).order("id",{ascending:true}).limit(120)
      .then(r=>{
        NET._busy=false;
        if(r&&r.error){if(typeof v3RelayError==='function')v3RelayError();relayFail(r.error);return;}
        if(typeof v3RelayOk==='function')v3RelayOk();
        const rows=(r&&r.data)||[];
        rows.forEach(row=>{
          if(row.id>(NET._lastId||0))NET._lastId=row.id;
          if(NET.isHost){
            if(row.target==="host")relayHandleHostPkt(row.sender,row.payload);
          }else{
            relayHandleGuestPkt(row);
          }
        });
        if(!NET.isHost&&B&&B.v3&&typeof v3SaveGuestSession==='function')v3SaveGuestSession();
        if(NET.isHost){
          const now=Date.now();
          NET.conns.slice().forEach(c=>{if(now-(c._seen||now)>20000)c.close();});
        }
      }).catch(()=>{NET._busy=false;if(typeof v3RelayError==='function')v3RelayError();});
  },400);
}
/* ---------- 心跳 ---------- */
function relayHeartbeat(){
  if(NET._hb)return;
  NET._hb=setInterval(()=>{
    if(!NET.code)return;
    if(NET.isHost){
      if(LOBBY&&!(B&&B.online&&B.over))boardPublish({code:NET.code,mode:LOBBY.mode,count:LOBBY.players.filter(p=>!p.ai).length});
      else boardUnpublish(NET.code);
      return;
    }
    relaySend("host",{t:"ping",pid:NET.pid});
    const d=dbx();if(!d)return;
    d.from("lls_room").select("updated_at").eq("code",NET.code).maybeSingle().then(r=>{
      if(B&&B.v3&&typeof v3CheckHostHeartbeat==='function'){if(!r||r.error)return;v3CheckHostHeartbeat(r.data);return;}
      const row=r&&r.data;
      const alive=row&&(Date.now()-new Date(row.updated_at).getTime()<90000);
      if(!alive&&LOBBY){toast("与房主的连接已断开");netCleanup();tab="vs";enterHub();renderHub();}
    }).catch(()=>{});
  },6000);
}
function netCleanup(){
  if(NET._v3timer)clearInterval(NET._v3timer);
  if(typeof v3ClearGuestSession==='function')v3ClearGuestSession();
  if(typeof v3ClearHostSession==='function')v3ClearHostSession();
  ["pubTimer","_loop","_hb","_joinTo"].forEach(k=>{if(NET[k]){clearInterval(NET[k]);NET[k]=null;}});
  const code=NET.code;
  if(code){
    if(NET.isHost){
      NET.conns.forEach(c=>{if(c.open)relaySend(c.pid,{t:"bye"});});
      boardUnpublish(code);
      const d=dbx();if(d)d.from("lls_pkt").delete().eq("room",code).then(()=>{});
    }else if(NET.host){
      relaySend("host",{t:"bye",pid:NET.pid});
    }
  }
  NET={peer:null,code:null,isHost:false,conns:[],host:null,pid:null,_lastId:0,_loop:null,_hb:null,pubTimer:null,_joinTo:null,_busy:false};
  LOBBY=null;
}
/* ---------- 房主建房 ---------- */
function hostRoom(){
  if(NET._joining){toast("正在连接中，请稍候…");return;}
  netInit(ok=>{if(!ok)return;NET._joining=true;relayHostCreate(0);});
}
function relayHostCreate(tryN){
  const code=String(Math.floor(1000+Math.random()*9000));
  const d=dbx();
  if(!d){NET._joining=false;toast("在线服务未就绪");return;}
  d.from("lls_room").insert({code:code,mode:"1v1",count:1,host:HOST_PID,updated_at:new Date().toISOString()}).select().then(r=>{
    if(r&&r.error){
      if(r.error.code==="23505"&&tryN<6)return relayHostCreate(tryN+1);
      NET._joining=false;toast("创建房间失败："+(r.error.message||"网络异常"));return;
    }
    startHost(code);
  }).catch(()=>{NET._joining=false;toast("创建房间失败：网络不可用");});
}
function startHost(code){
  NET._joining=false;
  NET.code=code;NET.isHost=true;NET.pid=HOST_PID;NET.peer={relay:true};
  NET.conns=[];NET._lastId=0;NET._busy=false;
  LOBBY={mode:"1v1",players:[{pid:HOST_PID,name:myName(),side:0,ready:false,ai:false,pick:[],cards:[]}]};
  syncLobbyState();

  boardPublish({code:code,mode:LOBBY.mode,count:1});
  try{dbx().from("lls_pkt").delete().lt("created_at",new Date(Date.now()-1800000).toISOString()).then(()=>{});}catch(_){ }
  relayLoop();relayHeartbeat();
}
/* ---------- 房客加入 ---------- */
function joinRoom(code){
  if(NET._joining){toast("正在连接中，请稍候…");return;}
  netInit(ok=>{
    if(!ok)return;
    NET._joining=true;
    toast("正在连接房间 "+code+"…");
    const d=dbx();
    let tries=0;
    const lookup=()=>{
      tries++;
      d.from("lls_room").select("code,updated_at").eq("code",code).maybeSingle().then(r=>{
      if(r&&r.error){NET._joining=false;toast("加入失败："+(r.error.message||"网络异常"));return;}
      const row=r&&r.data;
      const stale=row&&Date.now()-new Date(row.updated_at).getTime()>30000;
      if(!row||stale){
        // 云端读可能存在延迟：重试 3 次再判定
        if(tries<3&&!stale){setTimeout(lookup,1500);return;}
        NET._joining=false;
        if(stale){toast("房间 "+code+" 已过期");boardRequestList();renderVsEntryRefresh&&renderVsEntryRefresh();}
        else toast("房间 "+code+" 不存在");
        return;
      }
      NET.code=code;NET.isHost=false;NET.peer={relay:true};
      NET.pid="G"+Math.floor(Math.random()*1e6);
      NET.host={open:true,send:m=>relaySend("host",m)};
      NET.conns=[];NET._lastId=0;NET._busy=false;
      tab="vs";renderHub();
      relaySend("host",{t:"hello",pid:NET.pid,name:myName(),lvl:30,cards:competitionCards()});
      relaySend("host",{t:"ping",pid:NET.pid});
      relayLoop();relayHeartbeat();
      const t0=Date.now();
      NET._joinTo=setInterval(()=>{
        if(LOBBY){clearInterval(NET._joinTo);NET._joinTo=null;NET._joining=false;return;}
        if(Date.now()-t0>14000){
          clearInterval(NET._joinTo);NET._joinTo=null;
          NET._joining=false;
          if(!LOBBY){netCleanup();tab="vs";toast("房间 "+code+" 无响应：房主可能已退出");renderHub();}
        }
      },600);
    }).catch(()=>{if(tries<3){setTimeout(lookup,1500);return;}NET._joining=false;toast("加入失败：网络不可用");});
    };
    lookup();
  });
}
function sendTo(pid,msg){
  if(NET.isHost){const c=NET.conns.find(x=>x.pid===pid);if(c&&c.open)return c.send(msg);}
  else if(NET.host&&NET.host.open)return NET.host.send(msg);
}
function broadcast(msg){return Promise.all(NET.isHost?NET.conns.filter(c=>c.open).map(c=>c.send(msg)):[]);}
function pushLobby(){syncLobbyState();broadcast({t:"lobby",lobby:lobbySnap()});
  if(NET.isHost&&NET.code)boardPublish({code:NET.code,mode:LOBBY.mode,count:LOBBY.players.filter(p=>!p.ai).length,ts:Date.now()});
  renderVsPanel&&tab==="vs"&&renderHub();}
function lobbySnap(){
  return {mode:LOBBY.mode,code:NET.code,players:LOBBY.players.map(p=>({pid:p.pid,name:p.name,side:p.side,ready:p.ready,ai:p.ai,pick:p.pick.slice(),cards:p.cards,loadout:p.loadout||{}}))};
}
function syncLobbyState(){
  if(!LOBBY)return;
  LOBBY.players.forEach(p=>{
    if(p.pid===NET.pid)p.cards=competitionCards();
    else if(p.ai&&!p.cards.length)p.cards=aiRoster(LOBBY._aiLvl||6).map(m=>cardBrief(m));
  });
}
function cardBrief(m){const c=byNum(m.num),st=LanglangRules.stats(c,30);return {num:m.num,lvl:30,rar:c.rar,fac:c.fac,idn:c.idn,role:c.role,hp:st.hp,atk:st.atk,def:st.def,spd:st.spd,public:LanglangRules.PUBLIC.includes(m.num)};}
function competitionCards(){
  const nums=[...new Set([...G.roster.map(m=>m.num),...LanglangRules.PUBLIC])];
  return nums.filter(n=>byNum(n)).map(num=>cardBrief({num}));
}
function aiRoster(lvl){
  const pool=CARDS.filter(c=>c.rar==="R"||c.rar==="R2");
  const out=[];
  for(let i=0;i<3;i++){const c=pool.splice(Math.floor(Math.random()*pool.length),1)[0];out.push({num:c.num,lvl:Math.max(6,Math.min(30,lvl+Math.floor(Math.random()*3)))});}
  return out;
}
function selectedCards(p){return [...new Set([...(p.pick||[]),...p.cards.map(c=>c.num)])].slice(0,3);}
function onGuestLeave(c){
  if(!LOBBY||B&&B.online&&B.over)return;
  const p=LOBBY.players.find(x=>x.pid===c.pid);
  if(!p)return;
  if(B&&B.v3&&B.arena){v3Disconnect(c.pid);return;}
  if(B&&B.online){ // 战斗中掉线：其妖怪交给 AI
    toast(p.name+" 掉线，AI 接管");
    ["p","e"].forEach(side=>{
      B.owners[side]=B.owners[side].map(o=>o===c.pid?"ai":o);
      // 若其上场位处于倒地换人等待：自动换上其替补
      B.slots[side].forEach((ti,s)=>{
        if(B.duelForced[side][s]&&B.owners[side][ti]==="ai"){
          const cand=benchOf(side,"ai");
          if(cand.length){B.slots[side][s]=cand[0];B.duelForced[side][s]=false;}
        }
      });
    });
    if(B.duelCmds){netFillAI();netMaybeResolve();netCheckForcedDone();}
    sendNetSnap();return;
  }
  LOBBY.players=LOBBY.players.filter(x=>x.pid!==c.pid);
  pushLobby();
}
function onGuestMsg(c,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="v3resume"&&B&&B.v3&&B.arena&&B.arena.battle.players.some(p=>p.id===c.pid)){v3Reconnect(c.pid);v3Publish();return;}
  if(d.t==="v3cmd"&&B&&B.v3){v3Command(c.pid,d.cmd,d.turn,d.phase);return;}
  if(d.t==="hello"){
    c.pid=d.pid;
    if(!LOBBY)return;
    if(LOBBY.players.length>=(LOBBY.mode==="1v1"?2:4)){c.send({t:"full"});return;}
    LOBBY.players.push({pid:d.pid,name:d.name||"旅人",side:LOBBY.players.filter(p=>!p.ai).length%2,ready:false,ai:false,pick:[],cards:d.cards||[]});
    c.send({t:"lobby",lobby:lobbySnap()});
    pushLobby();
  }
  else if(d.t==="side"){const p=LOBBY&&LOBBY.players.find(x=>x.pid===c.pid);if(p){p.side=p.side===0?1:0;pushLobby();}}
  else if(d.t==="ready"){const p=LOBBY&&LOBBY.players.find(x=>x.pid===c.pid);if(p){p.ready=!!d.on;pushLobby();}}
  else if(d.t==="pick"){const p=LOBBY&&LOBBY.players.find(x=>x.pid===c.pid);if(p){p.pick=[...new Set((d.pick||[]).filter(n=>p.cards.some(cd=>cd.num===n)))].slice(0,3);p.ready=false;pushLobby();}}
  else if(d.t==="loadout"){const p=LOBBY&&LOBBY.players.find(x=>x.pid===c.pid);if(p&&d.num&&p.cards.some(cd=>cd.num===d.num)){
    const card=byNum(d.num),skills=d.skills,item=d.item||null;
    try{LanglangRules.equippedSkills({...card,selectedSkills:skills},30,true);if(item&&!LanglangRules.ITEMS[item])return;
      p.loadout=p.loadout||{};p.loadout[d.num]={skills:skills.slice(),item};p.ready=false;pushLobby();}catch(_){}
  }}
  else if(d.t==="cmd"&&B&&B.online){netOnCmd(c.pid,d.cmd);}
}
function onHostMsg(d){
  if(!d||typeof d!=="object")return;
  if(d.t==="v3start"){v3StartGuest(d);return;}
  if(d.t==="v3snap"){v3Receive(d);return;}
  if(d.t==="v3end"){v3EndGuest(d);return;}
  if(d.t==="lobby"){if(B&&B.v3)return;LOBBY=d.lobby;tab="vs";if(document.querySelector(".scr.on").id==="scr-hub")renderHub();else{enterHub();}return;}
  if(d.t==="full"){toast("房间已满，无法加入（稍后再试或另建房间）");netCleanup();tab="vs";enterHub();renderHub();return;}
  if(d.t==="note"){toast(d.txt);return;}
  if(d.t==="start"){netStartGuest(d);return;}
  if(d.t==="fx"){if(B&&B.online)playBattleEvent(d.event);return;}
  if(d.t==="snap"){
    NET.lastSnap=d.view;
    if(B&&B.online){
      clearTimeout(battleFxTimer);
      const delay=Math.max(0,battleFxUntil-Date.now());
      if(delay)battleFxTimer=setTimeout(()=>{if(B&&B.online&&NET.lastSnap)renderNetBattle();},delay);
      else renderNetBattle();
    }
    return;
  }
  if(d.t==="end"){netEndGuest(d);return;}
}

function netStartHost(){
  if(typeof v3StartHost==='function'){v3StartHost();return;}
  const per=LOBBY.mode==="2v2"?2:1;
  const sides=[0,1].map(sd=>LOBBY.players.filter(p=>p.side===sd));
  if(sides.some(ps=>ps.length!==per)){toast(per===2?"2v2 需要双方各两位玩家或 AI":"1v1 需要双方各一位玩家");return;}
  const mk=list=>{
    let mons=[],owners=[];
    for(const p of list){
      const selected=[...new Set([...(p.pick||[]),...p.cards.map(c=>c.num)])].slice(0,3);
      const src=selected.map(num=>p.cards.find(c=>c.num===num)).filter(Boolean);
      if(src.length!==3)return null;
      src.forEach(pk=>{mons.push(battleMons([pk])[0]);owners.push(p.pid);});
    }
    return {mons,owners};
  };
  const A=mk(sides[0]),Bd=mk(sides[1]);
  if(!A||!Bd){toast("每位玩家需要至少 3 只不同妖怪");return;}
  broadcast({t:"note",txt:"双方就绪，开战！"});
  LOBBY.players.forEach(p=>{
    if(p.ai)return;
    const c=NET.conns.find(x=>x.pid===p.pid);
    if(c&&c.open)c.send({t:"start",side:p.side,code:NET.code});
  });
  startNetBattle(A,Bd,per);
}
function startNetBattle(A,Bd,per){

    pTeam:A.mons.map(wrap),eTeam:Bd.mons.map(wrap),
    owners:{p:A.owners,e:Bd.owners},
    slots:{p:[],e:[]},duelCmds:{p:[],e:[]},duelForced:{p:[],e:[]},
    aP:0,aE:0,turn:1,msg:[],busy:false,forced:false,mode:"fight",over:false,

  };
  // 上场位：每位玩家的第一只妖怪上场，其余为替补；不足则由该玩家替补补位

/* ---------- 同步回合（所有人选完统一结算） ---------- */
function fieldWrap(side,slot){const ti=B.slots[side][slot];return side==="p"?B.pTeam[ti]:B.eTeam[ti];}
function fieldList(side){return B.slots[side].map((ti,i)=>({side,slot:i,ti,wrap:fieldWrap(side,i),owner:B.owners[side][ti]}));}
function mySlot(pid){
  for(const side of ["p","e"])for(let i=0;i<B.slots[side].length;i++){
    if(B.owners[side][B.slots[side][i]]===pid)return {side,slot:i,teamIdx:B.slots[side][i]};
  }
  return null;
}
function benchOf(side,pid){
  const list=side==="p"?B.pTeam:B.eTeam;
  return B.owners[side].map((o,ti)=>({o,ti}))
    .filter(x=>x.o===pid&&B.slots[side].indexOf(x.ti)<0&&list[x.ti].mon.hp>0)
    .map(x=>x.ti);
}
function slotLabel(side,slot){
  const fi=fieldList(side)[slot];
  const p=LOBBY.players.find(x=>x.pid===fi.owner);
  return (side==="p"?"蓝方·":"红方·")+(p?p.name:"AI");
}
function netRoundBegin(){
  ["p","e"].forEach(side=>{
    B.duelCmds[side]=B.slots[side].map(()=>null);
    B.duelForced[side]=B.slots[side].map(()=>false);
  });
  netFillAI();
  renderBattle();sendNetSnap();
}
function isAiOwner(owner){return owner==="ai"||!!(LOBBY&&LOBBY.players.some(p=>p.pid===owner&&p.ai));}
function netFillAI(){
  ["p","e"].forEach(side=>{
    B.slots[side].forEach((ti,slot)=>{
      const owner=B.owners[side][ti];let w=fieldWrap(side,slot);
      if(w.mon.hp<=0){
        const cand=benchOf(side,owner);
        if(isAiOwner(owner)&&cand.length){B.slots[side][slot]=cand[0];w=fieldWrap(side,slot);logLine("sys",slotLabel(side,slot)+" AI 换上了 "+byNum(w.mon.num).name+"！");}
        else if(!cand.length){B.duelCmds[side][slot]={k:"done"};return;}
        else return;
      }
      if(isAiOwner(owner)&&!B.duelCmds[side][slot]){
        const i=netBestIdx(w);B.duelCmds[side][slot]=i>=0?{k:"move",idx:i}:{k:"done"};
      }
    });
  });
}
function netBestIdx(w){
  const side=B.pTeam.indexOf(w)>=0?"p":"e";
  const foeSide=side==="p"?"e":"p";
  let foe=null;
  for(const f of fieldList(foeSide)){if(f.wrap.mon.hp>0){foe=f.wrap;break;}}
  if(!foe)return -1;
  const c=byNum(w.mon.num),fc=byNum(foe.mon.num);
  const mvs=movesOf(c);let best=-1,bs=-1;
  mvs.forEach((mv,i)=>{
    if(moveLock(w,mv,i))return;
    let s;
    if(mv.pow>0)s=mv.pow*mv.acc/100*(mv.type?effOf(mv.type,fc.idn):1)*((mv.type&&mv.type===c.idn)?1.2:1);
    else if(mv.kind==="heal")s=w.mon.hp<w.maxHp*.6?120:0;
    else if(mv.kind==="poison"||mv.kind==="bleed")s=foe.status[mv.kind]?0:90;
    else if(mv.kind==="stun")s=foe.stunImmune?0:75;
    else if(mv.kind==="weaken")s=foe.atkS>-2?60:0;
    else s=(w.atkS<2&&w.defS<2)?40:0;

  });

}
function netOnCmd(pid,cmd){
  if(!B||!B.online||B.over)return;
  if(cmd.k==="burst"){
    const s=mySlot(pid);if(!s)return;
    const w=fieldWrap(s.side,s.slot);
    if(!B.lock&&!B.duelCmds[s.side][s.slot]&&!w.awakened&&w.energy>=60){
      const battle=B;B.lock=true;renderBattle();sendNetSnap();
      awaken(w,s.side==="p"?"player":"enemy").finally(()=>{if(B===battle){B.lock=false;renderBattle();sendNetSnap();}});
    }
    return;
  }
  // 倒地换人（等待替补阶段）
  if(cmd.k==="switch"){
    for(const side of ["p","e"]){
      for(let s=0;s<B.slots[side].length;s++){
        if(B.duelForced[side][s]&&B.owners[side][B.slots[side][s]]===pid){
          const list=side==="p"?B.pTeam:B.eTeam,ni=cmd.idx,w=list[ni];
          if(w&&w.mon.hp>0&&B.owners[side][ni]===pid&&B.slots[side].indexOf(ni)<0){
            B.slots[side][s]=ni;B.duelForced[side][s]=false;
            logLine("sys",slotLabel(side,s)+" 换上了 "+byNum(w.mon.num).name+"！");
            netCheckForcedDone();
          }
          return;
        }
      }
    }
  }
  // 常规指令：只能指挥自己场上的妖怪
  const s=mySlot(pid);if(!s)return;
  if(B.duelCmds[s.side][s.slot]||B.lock)return;
  const w=fieldWrap(s.side,s.slot);
  if(w.mon.hp<=0)return;
  if(cmd.k==="move"){
    if(!Number.isInteger(cmd.idx))return;
    const mv=movesOf(byNum(w.mon.num))[cmd.idx];
    if(!mv||moveLock(w,mv,cmd.idx))return;
    if(cmd.target!=null){
      const foeSide=s.side==="p"?"e":"p";
      if(mv.target==="self"||!Number.isInteger(cmd.target)||cmd.target<0||cmd.target>=B.slots[foeSide].length||fieldWrap(foeSide,cmd.target).mon.hp<=0)return;
    }
  }else if(cmd.k==="pie"){if(!G.items.pie)return;}
  else if(cmd.k==="switch"){
    if(!Number.isInteger(cmd.idx)||!benchOf(s.side,pid).includes(cmd.idx))return;
  }else return;
  B.duelCmds[s.side][s.slot]=cmd;
  renderBattle();sendNetSnap();
  netMaybeResolve();
}
function netMaybeResolve(){
  if(!B||B.over||B.lock)return;
  const all=[...B.duelCmds.p,...B.duelCmds.e].every(c=>c);
  if(all)netResolveDuel();
}
async function netResolveDuel(){
  B.lock=true;renderBattle();sendNetSnap();
  // 1) 换人（消耗该位行动）
  for(const side of ["p","e"])for(let s=0;s<B.slots[side].length;s++){
    const c=B.duelCmds[side][s];
    if(c&&c.k==="switch"){
      const list=side==="p"?B.pTeam:B.eTeam,ni=c.idx,w=list[ni];
      if(w&&w.mon.hp>0&&B.owners[side][ni]===B.owners[side][B.slots[side][s]]&&B.slots[side].indexOf(ni)<0){
        B.slots[side][s]=ni;
        logLine("sys",slotLabel(side,s)+" 换上了 "+byNum(w.mon.num).name+"！");refreshBars();
      }
      B.duelCmds[side][s]={k:"done"};
    }
  }
  // 2) 烧饼（消耗该位行动）
  for(const side of ["p","e"])for(let s=0;s<B.slots[side].length;s++){
    const c=B.duelCmds[side][s];
    if(c&&c.k==="pie"){
      const w=fieldWrap(side,s),own=side==="p"?"player":"enemy";
      const heal=Math.min(w.maxHp-w.mon.hp,Math.floor(w.maxHp/2));
      if(heal>0){w.mon.hp+=heal;combatLog("heal",byNum(w.mon.num).name,null,"疗伤烧饼",heal);floatDmg(own,heal,true);refreshBars();}
      else combatLog("heal",byNum(w.mon.num).name,null,"体力已满，烧饼白带了");
      B.duelCmds[side][s]={k:"done"};
    }
  }
  // 3) 全员按速度出招（倒地者跳过，目标为对方场上存活妖怪）
  const movers=[];
  for(const side of ["p","e"])for(let s=0;s<B.slots[side].length;s++){
    const c=B.duelCmds[side][s];
    if(c&&c.k==="move"){
      const w=fieldWrap(side,s);
      if(w.mon.hp>0)movers.push({w,side,idx:c.idx,target:c.target,spd:monStats(w.mon).spd*(w.spdMul||1)+Math.random()});
    }
  }
  movers.sort((x,y)=>y.spd-x.spd);
  for(const m of movers){
    if(!B||B.over)return;
    if(m.w.mon.hp<=0)continue;
    if(skipStun(m.w)){await wait(420);if(!B)return;continue;}
    const foeSide=m.side==="p"?"e":"p";
    const foes=fieldList(foeSide);
    let target=(foes.find(f=>f.slot===m.target&&f.wrap.mon.hp>0)||foes.find(f=>f.wrap.mon.hp>0)||{}).wrap;
    if(!target)break;
    await useMove(m.w,target,m.idx,m.side);
    if(!B)return;
  }
  if(!B)return;
  B.lock=false;
  await netEndStepDuel();
  if(B)renderBattle();
}
async function netEndStepDuel(){
  for(const side of ["p","e"])for(const f of fieldList(side)){
    await tickStatuses(f.wrap,f.side==="p"?"player":"enemy");
    if(!B)return;
  }
  B.turn++;
  if(firstAlive(B.eTeam)<0){netFinish(true);return;}
  if(firstAlive(B.pTeam)<0){netFinish(false);return;}
  // 倒地换人：归属者决定，AI 自动
  for(const side of ["p","e"])for(let s=0;s<B.slots[side].length;s++){
    const w=fieldWrap(side,s);
    if(w.mon.hp>0)continue;
    const owner=B.owners[side][B.slots[side][s]];
    const cand=benchOf(side,owner);
    if(!cand.length)continue;
    if(isAiOwner(owner)){B.slots[side][s]=cand[0];logLine("sys",slotLabel(side,s)+" AI 换上了 "+byNum(fieldWrap(side,s).mon.num).name+"！");}
    else B.duelForced[side][s]=true;
  }
  netCheckForcedDone();
}
function netCheckForcedDone(){
  const pending=[...B.duelForced.p,...B.duelForced.e].some(f=>f);
  if(pending){renderBattle();sendNetSnap();}
  else netRoundBegin();
}
function netFinish(hostWin){
  B.over=true;B.lock=false;coachHide();sendNetSnap();boardUnpublish(NET.code);
  NET._done=true;
  const lines=[];let title,cls="";
  if(NET.isHost){
    title=hostWin?"胜利！":"败北…";cls=hostWin?"":"lose";
    lines.push(hostWin?"蓝方获胜！":"红方获胜！");
    G.coin+=hostWin?150:40;
    lines.push("山核桃 "+(hostWin?"+150":"+40"));
  }else{
    const myWin=(NET.mySide===0)===hostWin;

    lines.push(hostWin?"蓝方获胜！":"红方获胜！");
    G.coin+=myWin?150:40;
    lines.push("山核桃 "+(myWin?"+150":"+40"));
  }
  const rt=$("#res-title");rt.textContent=title;rt.className="res-t "+cls;
  $("#res-lines").innerHTML=lines.map(t=>`<div>${t}</div>`).join("");
  ovl("ovl-result",true);save();

  (netLastPlayers||[]).forEach(p=>{if(p.ai)return;const c=NET.conns.find(x=>x.pid===p.pid);if(c&&c.open)c.send({t:"end",win:(p.side===0)===hostWin});});
}

function snapWrapOf(w){return {num:w.mon.num,lvl:w.mon.lvl,hp:Math.max(0,w.mon.hp),maxHp:w.maxHp,energy:w.energy,awakened:w.awakened,status:Object.assign({},w.status),atkS:w.atkS,defS:w.defS,pp:w.mon.pp.slice()};}

let netLastPlayers=[];
function sendNetSnap(){
  if(!B||!B.online||!NET.isHost)return;
  netLastPlayers=LOBBY?LOBBY.players.slice():[];

function buildSnapFor(player){

  const forcedMine=s?B.duelForced[mine][s.slot]:false;

  const bench=s?benchOf(mine,player.pid).map(ti=>{

    return {ti,num:w.mon.num,name:byNum(w.mon.num).name,lvl:w.mon.lvl,hp:Math.max(0,w.mon.hp),maxHp:w.maxHp};
  }):[];
  const moves=(myWrap&&myWrap.mon.hp>0&&!forcedMine)?movesOf(byNum(myWrap.mon.num)).map((mv,i)=>({name:mv.name,type:mv.type,target:mv.target||"foe",cat:mv.category,cost:mv.cost,gain:mv.gain,lock:moveLock(myWrap,mv,i),pp:myWrap.mon.pp[i],maxpp:mv.pp,eff:mv.pow?effOf(mv.type,byNum(fieldWrap(foeS,0).mon.num).idn):1,icon:mv.icon,desc:mv.desc})):[];
  const foeSnap=listAll(foeS),meList=s?listAll(mine):[];

  menu.querySelectorAll("[data-nsw]").forEach(b=>b.addEventListener("click",()=>{
    const idx=+b.dataset.nsw,mon=v.bench.find(m=>m.ti===idx);if(!mon||NET.uiAction&&NET.uiAction.sent)return;
    NET.uiChoice=null;const action={key:choiceKey,text:"换上 "+mon.name,sent:true},current=NET;NET.uiAction=action;
    doCmd({k:"switch",idx});
    if(!NET.isHost){renderNetBattle(v);setTimeout(()=>{if(NET===current&&NET.uiAction===action&&NET.lastSnap&&NET.lastSnap.mode===v.mode){NET.uiAction=null;renderNetBattle();toast("尚未收到房主确认，请重试");}},6000);}
  }));
  const np=$("#bt-npie");if(np)np.addEventListener("click",()=>doCmd({k:"pie"}));
  const bb=$("#bt-nburst");if(bb)bb.addEventListener("click",()=>doCmd({k:"burst"}));
}

/* ---------- 启动 ---------- */
(function init(){
  const g=load();
  if(g){$("#bt-continue").style.display="";G=g;}
})();
</script>
